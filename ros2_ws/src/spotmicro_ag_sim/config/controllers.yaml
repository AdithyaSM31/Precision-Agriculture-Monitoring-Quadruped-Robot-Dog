controller_manager:
  ros__parameters:
    update_rate: 500
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    leg_effort_controller:
      type: effort_controllers/JointGroupEffortController

leg_effort_controller:
  ros__parameters:
    joints:
      - fl_abd_joint
      - fl_hip_joint
      - fl_knee_joint
      - fr_abd_joint
      - fr_hip_joint
      - fr_knee_joint
      - rl_abd_joint
      - rl_hip_joint
      - rl_knee_joint
      - rr_abd_joint
      - rr_hip_joint
      - rr_knee_joint
